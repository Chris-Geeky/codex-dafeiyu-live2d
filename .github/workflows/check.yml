name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node --version
      - run: npm test
      - run: node cli.mjs verify
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile the native tray launcher
        shell: powershell
        run: |
          ./scripts/Build-Launcher.ps1 -OutputPath (Join-Path $PWD 'Launcher-check.exe')
      - name: Render native UI previews without connecting to Codex
        shell: powershell
        run: |
          foreach ($state in @('active','waiting','error','license','about','close','appearance')) {
            $output = Join-Path $PWD ('tests/.artifacts/preview-' + $state + '.png')
            $process = Start-Process -FilePath (Join-Path $PWD 'Launcher-check.exe') -ArgumentList @('--preview', ('"' + $output + '"'), '--state', $state) -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw ('UI preview failed: ' + $state) }
            $layout = Get-Content -LiteralPath ($output + '.layout.json') -Raw -Encoding UTF8 | ConvertFrom-Json
            $baseWidth = if ($state -eq 'close') { 520 } elseif ($state -in @('license','about')) { 540 } else { 600 }
            if ($layout.width -ne [Math]::Round($baseWidth * $layout.dpi / 96)) { throw ('DPI layout failed: ' + $state) }
          }
      - name: Check consent and control states without launching a controller
        shell: powershell
        run: ./scripts/Test-Launcher.ps1 -ExecutablePath (Join-Path $PWD 'Launcher-check.exe')
