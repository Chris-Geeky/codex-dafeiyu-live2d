<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表情与装扮 · 大肥鱼</title><link rel="stylesheet" href="ui.css"></head>
<body><main>
<header><div><p class="eyebrow">大肥鱼 · 个性设置</p><h1>表情与装扮</h1><p>先预览你的搭配，再应用到桌面伙伴。</p></div><div class="theme-switch segmented" aria-label="界面主题"><button data-theme-choice="system" aria-label="跟随系统主题">系统</button><button data-theme-choice="light" aria-label="浅色主题">浅色</button><button data-theme-choice="dark" aria-label="深色主题">深色</button></div></header>
<div class="columns"><section class="settings card"><nav class="tabs" aria-label="设置分类"><button id="faces-tab" role="tab" aria-selected="true" aria-controls="faces-panel">表情 <span>20</span></button><button id="outfits-tab" role="tab" aria-selected="false" aria-controls="outfits-panel">装扮 <span>10 类</span></button></nav>
<div id="faces-panel" role="tabpanel" aria-labelledby="faces-tab"><div class="field"><label>表情模式</label><div id="expression"></div></div><div class="automatic-box"><label class="automatic"><input id="automatic" type="checkbox">自动轮换表情</label><div id="expression-scope"></div><p>一轮内不重复；任务运行时也会变化。状态切换先表达，再继续轮换。</p></div><div class="section-title"><h2>试试这些表情</h2><span>点击可固定预览</span></div><div id="face-gallery" class="face-gallery"></div></div>
<div id="outfits-panel" role="tabpanel" aria-labelledby="outfits-tab" hidden><p class="section-intro">同类选一种，不同类别可以自由搭配。</p><div id="accessories" class="accessories"></div><p class="small-note">手势在动作结束后显示，手机配色在手机出现时可见。</p></div></section>
<aside><div class="preview-card card"><div class="preview-toolbar"><div><h2>实时预览</h2><span id="current-expression">自然表情</span></div><div class="segmented"><button id="dynamic" aria-pressed="true">动态</button><button id="static" aria-pressed="false">静态</button></div></div><div id="stage" data-background="theme"><div id="pet" class="codex-avatar-root" data-codex-pet-id="preview" data-codex-pet-state="idle"></div><div id="loading">正在准备预览…</div></div><p id="fps">跟随动画帧率</p><div class="background-row"><span>预览背景</span><div class="segmented"><button data-background-choice="theme" aria-label="跟随主题预览背景">随主题</button><button data-background-choice="light" aria-label="浅色预览背景">浅</button><button data-background-choice="dark" aria-label="深色预览背景">深</button><button data-background-choice="checker" aria-label="棋盘预览背景">棋盘</button></div></div></div>
<section class="effects card"><div class="section-title"><h2>桌面效果</h2><span>播放一次</span></div><div id="effect-choice"></div><div class="effect-row"><button id="preview-effect">预览</button><button id="play-effect">宠物播放</button></div><p>画笔、橡皮是姿态；按压效果用于模型展示。</p></section></aside></div>
<footer><button id="reset" class="quiet">恢复默认</button><p id="message" role="status"></p><div class="buttons"><button id="close">关闭</button><button id="apply" class="primary">应用到大肥鱼</button></div></footer>
</main><script type="module" src="ui.mjs"></script></body></html>
